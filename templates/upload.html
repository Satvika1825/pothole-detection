<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - Pothole Detection System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .upload-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .gps-status {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .gps-status.acquiring {
            background: #fff3cd;
            border-color: #ffc107;
        }
        
        .gps-status.error {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .upload-type-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .type-option {
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .type-option:hover {
            border-color: #667eea;
            background: #f8f9fa;
        }
        
        .type-option.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .type-option input[type="radio"] {
            display: none;
        }
        
        .file-upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .file-upload-area:hover {
            border-color: #667eea;
            background: #f8f9fa;
        }
        
        .file-upload-area.dragover {
            border-color: #667eea;
            background: #e8eaf6;
        }
        
        #camera-section {
            text-align: center;
        }
        
        #camera-preview {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .camera-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-success {
            background: #27ae60;
            color: white;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 1.2em;
            margin-top: 25px;
        }
        
        .nav-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .nav-links a {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .nav-links a:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚨 Pothole Detection</h1>
            <p class="subtitle">Upload images or videos to detect road damage</p>
        </header>
        
        <div class="upload-section">
            <div id="gps-status" class="gps-status acquiring">
                📍 Acquiring GPS location...
            </div>
            
            <form method="POST" enctype="multipart/form-data" id="upload-form">
                <div class="form-group">
                    <label>📍 Location Description</label>
                    <input type="text" name="location" id="location" 
                           placeholder="e.g., Main Street near City Hall" required>
                </div>
                
                <input type="hidden" name="latitude" id="latitude">
                <input type="hidden" name="longitude" id="longitude">
                
                <div class="form-group">
                    <label>📸 Detection Method</label>
                    <div class="upload-type-selector">
                        <label class="type-option active">
                            <input type="radio" name="upload_type" value="image" checked>
                            <div style="font-size: 2em;">🖼️</div>
                            <div>Image</div>
                        </label>
                        <label class="type-option">
                            <input type="radio" name="upload_type" value="video">
                            <div style="font-size: 2em;">🎥</div>
                            <div>Video</div>
                        </label>
                        <label class="type-option">
                            <input type="radio" name="upload_type" value="camera">
                            <div style="font-size: 2em;">📷</div>
                            <div>Camera</div>
                        </label>
                    </div>
                </div>
                
                <div id="file-section">
                    <div class="file-upload-area" id="drop-zone">
                        <div style="font-size: 3em; margin-bottom: 15px;">📤</div>
                        <h3>Drag & Drop or Click to Upload</h3>
                        <p style="color: #666; margin-top: 10px;">
                            Supported: Images (JPG, PNG, GIF) or Videos (MP4, AVI, MOV)
                        </p>
                        <input type="file" name="file" id="file-input" 
                               accept="image/*,video/*" style="display: none;">
                    </div>
                    <div id="file-preview" style="margin-top: 15px; display: none;">
                        <p><strong>Selected:</strong> <span id="file-name"></span></p>
                    </div>
                </div>
                
                <div id="camera-section" style="display: none;">
                    <video id="camera-preview" autoplay playsinline></video>
                    <canvas id="camera-canvas" style="display: none;"></canvas>
                    <div class="camera-controls">
                        <button type="button" class="btn btn-success" id="capture-btn">
                            📸 Capture Photo
                        </button>
                        <button type="button" class="btn btn-danger" id="stop-camera-btn">
                            ⏹️ Stop Camera
                        </button>
                    </div>
                    <input type="hidden" name="camera_image" id="camera-image-data">
                </div>
                
                <button type="submit" class="btn submit-btn" id="submit-btn">
                    🔍 Detect Potholes
                </button>
            </form>
            
            <div class="nav-links">
                <a href="/dashboard">📊 Dashboard</a>
                <a href="/clusters">🗺️ Routes</a>
                <a href="/logout">🚪 Logout</a>
            </div>
        </div>
    </div>
    
    <script>
        // GPS Functionality
        function getGPSLocation() {
            const gpsStatus = document.getElementById('gps-status');
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('latitude').value = position.coords.latitude;
                        document.getElementById('longitude').value = position.coords.longitude;
                        gpsStatus.className = 'gps-status';
                        gpsStatus.innerHTML = `✅ GPS Location Acquired: ${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`;
                    },
                    (error) => {
                        gpsStatus.className = 'gps-status error';
                        gpsStatus.innerHTML = '⚠️ GPS not available. Location will be based on description only.';
                        console.error('GPS Error:', error);
                    }
                );
            } else {
                gpsStatus.className = 'gps-status error';
                gpsStatus.innerHTML = '⚠️ GPS not supported by this browser.';
            }
        }
        
        // Get GPS on page load
        getGPSLocation();
        
        // Upload type switching
        const typeOptions = document.querySelectorAll('.type-option');
        const fileSection = document.getElementById('file-section');
        const cameraSection = document.getElementById('camera-section');
        
        typeOptions.forEach(option => {
            option.addEventListener('click', function() {
                typeOptions.forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
                
                const radio = this.querySelector('input[type="radio"]');
                radio.checked = true;
                
                if (radio.value === 'camera') {
                    fileSection.style.display = 'none';
                    cameraSection.style.display = 'block';
                    startCamera();
                } else {
                    fileSection.style.display = 'block';
                    cameraSection.style.display = 'none';
                    stopCamera();
                }
            });
        });
        
        // File upload handling
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const filePreview = document.getElementById('file-preview');
        const fileName = document.getElementById('file-name');
        
        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            handleFileSelect();
        });
        
        fileInput.addEventListener('change', handleFileSelect);
        
        function handleFileSelect() {
            if (fileInput.files.length > 0) {
                fileName.textContent = fileInput.files[0].name;
                filePreview.style.display = 'block';
            }
        }
        
        // Camera handling
        let stream = null;
        
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                document.getElementById('camera-preview').srcObject = stream;
            } catch (err) {
                alert('Camera access denied or not available: ' + err.message);
                console.error('Camera error:', err);
            }
        }
        
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }
        
        document.getElementById('capture-btn').addEventListener('click', function() {
            const video = document.getElementById('camera-preview');
            const canvas = document.getElementById('camera-canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            const imageData = canvas.toDataURL('image/jpeg');
            document.getElementById('camera-image-data').value = imageData;
            
            alert('Photo captured! Click "Detect Potholes" to analyze.');
        });
        
        document.getElementById('stop-camera-btn').addEventListener('click', stopCamera);
        
        // Form submission
        document.getElementById('upload-form').addEventListener('submit', function(e) {
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = '🔄 Processing...';
        });
    </script>
</body>
</html>
